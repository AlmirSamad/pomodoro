<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fokus</title>
  </head>
  <body class="page">
    <a href="#main-content" class="skip-link">
      Pular para o conteudo principal
    </a>
    <header>
      <h1 class="logo">
        <img src="/logo.png" alt="" />
      </h1>
    </header>
    <main id="main-content">
      <section aria-label="Banner" class="banner">
        <h2 class="banner__title">
          Frase extremamente motivacional.<strong
            class="banner__title--highlight"
          >
            para você fingir que vai estudar e eu fingir que vou escrever algo
            sério aqui
          </strong>
        </h2>

        <img src="/mode-1.png" alt="" />
      </section>

      <section aria-label="Timer" class="timer-card">
        <div role="tablist" aria-label="Tipo de timer" class="timer-card__tabs">
          <button
            class="timer-card__tab timer-card__tab--active"
            role="tab"
            type="button"
            aria-selected="true"
          >
            Foco
          </button>
          <button
            class="timer-card__tab"
            role="tab"
            type="button"
            aria-selected="false"
          >
            Descanso curto
          </button>
          <button
            class="timer-card__tab"
            role="tab"
            type="button"
            aria-selected="false"
          >
            Descanso longo
          </button>
        </div>
        <div class="timer-card__display">
          <span
            class="timer-card__time"
            role="timer"
            aria-live="polite"
            aria-label="tempo restante"
            >00:25</span
          >
        </div>
        <label for="toggle-music" class="music-toggle">
          <input
            type="checkbox"
            name=""
            id="toggle-music"
            class="music-toggle__input"
          />
          Música
        </label>
        <form class="timer-card__form">
          <button class="button">Começar</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
